apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lastmission
  namespace: lastmission
spec:
  hostnames:
    - lastmission.example.com
  parentRefs:
    - name: example-gateway
      namespace: gateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: lastmission-frontend
          port: 80
