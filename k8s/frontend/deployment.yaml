apiVersion: apps/v1
kind: Deployment
metadata:
  name: lastmission-frontend
  namespace: lastmission
  labels:
    app: lastmission-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lastmission-frontend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: lastmission-frontend
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: asus-vm200
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: lastmission-frontend
          image: ghcr.io/your-org/lastmission-frontend:e2969f948e6fcb07dbe6ca04822cfa29bf163b23
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
