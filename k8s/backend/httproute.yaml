apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lastmission-api
  namespace: lastmission
spec:
  hostnames:
    - lastmission-api.coder-han.com
  parentRefs:
    - name: coder-han-gateway
      namespace: gateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: lastmission-backend
          port: 80
