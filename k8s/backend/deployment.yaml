apiVersion: apps/v1
kind: Deployment
metadata:
  name: lastmission-backend
  namespace: lastmission
  labels:
    app: lastmission-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lastmission-backend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: lastmission-backend
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: asus-vm200
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: lastmission-backend
          image: ghcr.io/your-org/lastmission-backend:5f924369869e0767b38ed05e617c1d9079b608fd
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: lastmission-backend-env
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: kafka-server-ca
              mountPath: /app/coderhan/kafka-ca
              readOnly: true
            - name: vault-bootstrap
              mountPath: /app/coderhan/bootstrap
              readOnly: true
      volumes:
        - name: kafka-server-ca
          configMap:
            name: kafka181-server-ca
        - name: vault-bootstrap
          secret:
            secretName: lastmission-backend-vault-bootstrap
