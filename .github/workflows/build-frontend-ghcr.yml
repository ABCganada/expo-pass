name: Build and Push Frontend Image to GHCR

# 모노레포: frontend/ 가 바뀔 때만 프론트 이미지를 빌드한다.
on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/build-frontend-ghcr.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: lastmission-gitops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      # NEXT_PUBLIC_* 는 빌드 시점에 번들에 박히므로 build-arg 로 주입해야 한다.
      # 브라우저에 공개되는 빌드 값이므로 운영 API 주소를 명시한다.
      NEXT_PUBLIC_API_URL: https://lastmission-api.example.com

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate frontend build configuration
        run: test -n "$NEXT_PUBLIC_API_URL"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # 빌드와 push 를 한 단계로 처리한다(분리하면 GHCR 에서 unknown blob 실패).
      # provenance/sbom 을 끄는 이유도 같다 — 부가 매니페스트 없이 이미지만 단순하게 올린다.
      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/lastmission-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/lastmission-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update frontend manifest image tag
        run: |
          sed -i -E "s|(image: ghcr\.io/[^:]+/lastmission-frontend):.*|\1:${{ github.sha }}|" k8s/frontend/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/frontend/deployment.yaml
          git diff --cached --quiet || git commit -m "chore: deploy frontend ${{ github.sha }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
