name: Build and Push Backend Image to GHCR

# 모노레포: backend/ 가 바뀔 때만 백엔드 이미지를 빌드한다.
on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/build-backend-ghcr.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: lastmission-gitops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # backend/build.gradle.kts 가 사설 Nexus(example-auth-client / vault-cert)에서
      # 의존성을 받으므로 Cloudflare Access 서비스 토큰이 필요하다.
      # 이 값들은 GitHub repo Secrets 에 CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET 로 등록한다.
      # (Dockerfile 이 이 secret 들을 읽어 CF_ACCESS_AUTHORIZATION 헤더를 만든다.)
      - name: Build, test, and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          provenance: false
          sbom: false
          secrets: |
            cf_access_client_id=${{ secrets.CF_ACCESS_CLIENT_ID }}
            cf_access_client_secret=${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/lastmission-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/lastmission-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout central GitOps repository
        uses: actions/checkout@v4
        with:
          repository: viinac/k8s
          token: ${{ secrets.K8S_REPO_TOKEN }}
          ref: main
          path: _gitops

      - name: Update central backend image tag
        working-directory: _gitops
        run: |
          set -euo pipefail
          manifest="apps/lastmission/backend/deployment.yaml"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i -E "s|(image: ghcr\.io/[^:]+/lastmission-backend):.*|\1:${{ github.sha }}|" "$manifest"
          git add "$manifest"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(deploy): lastmission backend ${GITHUB_SHA::12}"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
